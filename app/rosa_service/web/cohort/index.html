<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cohort — MNI coverage</title>
<style>
  :root{ --ground:#1e2530; --panel:#141b24; --line:#2b3947; --ink:#dbe6f0;
         --muted:#7c8c9c; --faint:#4a5765; --accent:#38d2e6;
         --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
         --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  [hidden]{ display:none !important; }   /* beat author display rules below */
  body{ background:var(--ground); color:var(--ink); font-family:var(--sans); overflow:hidden; }
  #app{ display:grid; grid-template-columns:230px 1fr; height:100vh; }
  #legend{ background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .lg-head{ padding:14px 14px 8px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .lg-head span{ color:var(--faint); }
  #sublist{ overflow-y:auto; flex:1; padding:2px 8px 8px; }
  .sub{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:7px 8px; margin:2px 0;
        background:transparent; border:1px solid transparent; border-radius:7px; color:var(--ink); cursor:pointer; font-size:12.5px; }
  .sub:hover{ background:#10202a; }
  .sub.on{ border-color:var(--accent); background:#0e2830; }
  .sw{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(255,255,255,.08); }
  .sl{ flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sn{ font-family:var(--mono); font-size:11px; color:var(--muted); }
  #showall{ margin:8px; padding:7px; border:1px solid var(--line); background:transparent; color:var(--muted);
            border-radius:7px; cursor:pointer; font-size:12px; }
  #showall:hover{ color:var(--ink); border-color:var(--accent); }
  #stage{ position:relative; min-width:0; }
  #host{ position:absolute; inset:0; }
  #host canvas{ display:block; }
  #caption{ position:absolute; left:0; right:0; bottom:0; padding:8px 14px; font-size:10.5px; color:var(--muted);
            background:linear-gradient(transparent,#0b0f14cc); pointer-events:none; text-align:center; }
  #tip{ position:absolute; z-index:5; pointer-events:none; background:#0b1219ee; border:1px solid var(--line);
        border-radius:6px; padding:5px 8px; font-size:11.5px; color:var(--ink); white-space:nowrap;
        font-family:var(--mono); box-shadow:0 4px 16px #0008; }
  /* Readable, non-blocking cards (pointer-events:none so they never eat drags) */
  #empty, #loading{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    max-width:340px; text-align:center; padding:15px 22px; border-radius:12px;
    background:#0b1219f2; border:1px solid var(--line); color:var(--ink);
    font-size:13px; line-height:1.7; pointer-events:none; box-shadow:0 12px 36px #000a; }
  #empty b{ color:var(--accent); }
</style>
<script async src="/assets/three/es-module-shims.js"></script>
<script type="importmap">
{ "imports": { "three": "/assets/three/three.module.js", "three/addons/": "/assets/three/addons/" } }
</script>
</head>
<body>
<div id="app">
  <aside id="legend">
    <div class="lg-head">Subjects <span id="subcount"></span></div>
    <div id="sublist"></div>
    <button id="showall" hidden>Show all subjects</button>
  </aside>
  <main id="stage">
    <div id="host"></div>
    <div id="tip" hidden></div>
    <div id="empty" hidden>No MNI-poolable cases yet.<br>Label cases with <b>CerebrA</b> (through the MRI) to pool them here.</div>
    <div id="loading">Loading cohort…</div>
    <div id="caption">Contacts pooled in MNI152NLin2009cSym by <b>affine</b> registration — a coverage overview, not millimetric cross-subject localization.</div>
  </main>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const $ = (id) => document.getElementById(id);
const host = $("host");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2530);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
camera.up.set(0, 0, 1);                                   // RAS: superior is up
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
host.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(1, 0.6, 1); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-1, -0.4, -0.8); scene.add(fill);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.09;

function resize() {
  const w = host.clientWidth || 1, h = host.clientHeight || 1;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);

// The shared MNI glass brain (translucent backdrop; contacts show through).
new GLTFLoader().load("/api/v1/cohort/brain.glb", (gltf) => {
  gltf.scene.traverse((o) => {
    if (o.material) { o.material.transparent = true; o.material.depthWrite = false; o.material.side = THREE.DoubleSide; }
  });
  scene.add(gltf.scene);
}, undefined, () => {});   // a missing brain just leaves the points on a bare ground

// Per-point cloud: round sprites, per-vertex colour + size + dim so selecting a
// subject can brighten/enlarge its points and fade the rest.
const V_SHADER = `
  attribute vec3 pcolor; attribute float size; attribute float dim;
  varying vec3 vC; varying float vD;
  void main(){ vC = pcolor; vD = dim;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (320.0 / -mv.z);
    gl_Position = projectionMatrix * mv; }`;
const F_SHADER = `
  varying vec3 vC; varying float vD;
  void main(){ vec2 d = gl_PointCoord - vec2(0.5); float r = dot(d, d);
    if (r > 0.25) discard;
    float a = smoothstep(0.25, 0.10, r);
    gl_FragColor = vec4(vC, a * vD); }`;

const BASE = 3.4, SEL = 6.0;
let META = [], POINTS = null, selId = null;

function buildCloud(subjects) {
  const N = subjects.reduce((n, s) => n + s.contacts.length, 0);
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const size = new Float32Array(N), dim = new Float32Array(N);
  META = new Array(N);
  let i = 0;
  for (const s of subjects) {
    const c = new THREE.Color(s.color);
    for (const ct of s.contacts) {
      pos[i*3] = ct[0]; pos[i*3+1] = ct[1]; pos[i*3+2] = ct[2];
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
      size[i] = BASE; dim[i] = 0.92;
      META[i] = { sid: s.id, slabel: s.label, region: ct[3], hemi: ct[4], name: ct[5], color: s.color };
      i++;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("pcolor", new THREE.BufferAttribute(col, 3));
  g.setAttribute("size", new THREE.BufferAttribute(size, 1));
  g.setAttribute("dim", new THREE.BufferAttribute(dim, 1));
  const m = new THREE.ShaderMaterial({ vertexShader: V_SHADER, fragmentShader: F_SHADER,
    transparent: true, depthTest: false, depthWrite: false });
  POINTS = new THREE.Points(g, m); POINTS.renderOrder = 2; POINTS.frustumCulled = false;
  scene.add(POINTS);
}

function applySelection() {
  if (!POINTS) return;
  const size = POINTS.geometry.getAttribute("size"), dim = POINTS.geometry.getAttribute("dim");
  for (let i = 0; i < META.length; i++) {
    const on = META[i].sid === selId;
    size.setX(i, selId && on ? SEL : BASE);
    dim.setX(i, !selId ? 0.92 : (on ? 0.99 : 0.10));
  }
  size.needsUpdate = true; dim.needsUpdate = true;
}

// ---- legend + selection ------------------------------------------------
function buildLegend(subjects) {
  const list = $("sublist"); list.innerHTML = "";
  $("subcount").textContent = subjects.length ? "· " + subjects.length : "";
  for (const s of subjects) {
    const row = document.createElement("button");
    row.className = "sub"; row.dataset.id = s.id;
    row.innerHTML = `<span class="sw" style="background:${s.color}"></span>` +
      `<span class="sl"></span><span class="sn">${s.contacts.length}</span>`;
    row.querySelector(".sl").textContent = s.label;
    row.onclick = () => selectSubject(s.id === selId ? null : s.id);
    list.appendChild(row);
  }
}
function selectSubject(id) {
  selId = id; applySelection();
  document.querySelectorAll("#sublist .sub").forEach((r) => r.classList.toggle("on", r.dataset.id === id));
  $("showall").hidden = !id;
  if (id) focusSubject(id);
}
$("showall").onclick = () => selectSubject(null);

// ---- camera framing ----------------------------------------------------
function fitBox(box, pad) {
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const radius = Math.max(s.x, s.y, s.z, 40) * 0.5 * (pad || 1.5);
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5));
  controls.target.copy(c);
  const dir = new THREE.Vector3(-0.55, -0.9, 0.5).normalize();   // left-anterior-superior oblique
  camera.position.copy(c).addScaledVector(dir, dist);
  camera.near = Math.max(dist / 100, 0.1); camera.far = dist * 12; camera.updateProjectionMatrix();
  controls.update();
}
function initCamera() {
  fitBox(new THREE.Box3(new THREE.Vector3(-78, -112, -70), new THREE.Vector3(78, 78, 85)), 1.35);
}
function focusSubject(id) {
  if (!POINTS) return;
  const p = POINTS.geometry.getAttribute("position"), box = new THREE.Box3(), v = new THREE.Vector3();
  for (let i = 0; i < META.length; i++) if (META[i].sid === id) { v.set(p.getX(i), p.getY(i), p.getZ(i)); box.expandByPoint(v); }
  if (!box.isEmpty()) fitBox(box, 2.4);
}

// ---- hover tooltip -----------------------------------------------------
const ray = new THREE.Raycaster(); ray.params.Points.threshold = 2.3;
const mouse = new THREE.Vector2(), tip = $("tip");
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!POINTS) { tip.hidden = true; return; }
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObject(POINTS, false);
  const h = hits.find((x) => !selId || META[x.index].sid === selId);
  if (h) {
    const m = META[h.index];
    tip.innerHTML = `<b style="color:${m.color}">${m.slabel}</b> · ${m.name || "—"}` +
      (m.region ? " · " + m.region : "") + (m.hemi ? " · " + m.hemi : "");
    tip.style.left = (e.clientX - r.left + 13) + "px";
    tip.style.top = (e.clientY - r.top + 13) + "px";
    tip.hidden = false;
  } else tip.hidden = true;
});
renderer.domElement.addEventListener("pointerleave", () => { tip.hidden = true; });

// ---- boot --------------------------------------------------------------
function tick() { requestAnimationFrame(tick); controls.update(); renderer.render(scene, camera); }
resize(); initCamera(); tick();

fetch("/api/v1/cohort/contacts").then((r) => r.json()).then((data) => {
  $("loading").hidden = true;
  const subjects = (data && data.subjects) || [];
  if (!subjects.length) { $("empty").hidden = false; return; }
  buildLegend(subjects); buildCloud(subjects);
}).catch((e) => { $("loading").textContent = "Failed to load cohort: " + e.message; });
</script>
</body>
</html>
